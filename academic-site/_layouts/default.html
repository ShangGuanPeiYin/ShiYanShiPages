{% assign ui = site.data.i18n[page.locale] | default: site.data.i18n.zh %}
<!DOCTYPE html>
<html lang="{{ page.locale | default: 'zh' }}">

  {% include head.html %}

  <body data-baseurl="{{ site.baseurl }}">
    <a class="skip-link" href="#main">{% if page.locale == 'en' %}Skip to content{% else %}跳至正文{% endif %}</a>
    {% include icons.svg %}

    {% include header.html %}

    <main id="main" class="site-container">
      {{ content }}
    </main>

    {% include footer.html %}

  </body>

</html>
