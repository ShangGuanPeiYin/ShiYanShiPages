name: MVAS Lab
title: 机器视觉与自主系统实验室
institution: 上海交通大学电子信息与电气工程学院自动化系
email: jglu@sjtu.edu.cn
photo: ../assets/legacy/images/team_photo.jpg
links: {}
accent_color: '#1a7a6d'
dark_mode: true
math: false
description: 让机器在真实世界中看见、理解并自主行动。
url: http://127.0.0.1:4000
baseurl: ''
analytics:
  google_id: ''
  plausible_domain: ''
  umami_website_id: ''
  umami_src: ''
  goatcounter: ''
nav_pages:
- name: about
- name: publications
- name: talks
- name: research
- name: software
- name: team
- name: teaching
- name: blog
scholar:
  last_name: ''
  first_name: []
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  query: '@*'
  bibliography_list_attributes:
    reversed: reversed
  bibtex_skip_fields:
  - abstract
  - month_numeric
  - file
  - selected
  - code
  - slides
  - video
  - poster
  - data
permalink: /blog/:year/:title/
include:
- _pages
sass:
  style: compressed
  quiet_deps: true
  silence_deprecations:
  - import
  sourcemap: development
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: '


  '
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
plugins:
- jekyll/scholar
- jekyll-sitemap
exclude:
- Gemfile
- Gemfile.lock
- README.md
- UPGRADING.md
- LICENSE
- setup.sh
- images/screenshots
- vendor
- .bundle
- node_modules
- UPSTREAM.md
- README-MVAS.md
- migration-generated.json
lang: zh-CN
